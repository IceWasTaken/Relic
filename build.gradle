import org.apache.tools.ant.taskdefs.condition.Os

plugins {
    id 'java'
    id 'maven-publish'
    id 'application'
}

String lwjglNatives;

if(Os.isFamily(Os.FAMILY_WINDOWS)) {
    lwjglNatives = "natives-windows";
} else if (Os.isFamily(Os.FAMILY_UNIX)) {
    lwjglNatives = "natives-linux";
}

repositories {
    mavenCentral()
    maven { url "https://central.sonatype.com/repository/maven-snapshots" }
}

dependencies {
    implementation platform("org.lwjgl:lwjgl-bom:$lwjglVersion")
    implementation "org.lwjgl:lwjgl"
    implementation "org.lwjgl:lwjgl-assimp"
    implementation "org.lwjgl:lwjgl-par"
    implementation "org.lwjgl:lwjgl-fmod"
    implementation "org.lwjgl:lwjgl-glfw"
    implementation "org.lwjgl:lwjgl-nanovg"
    implementation "org.lwjgl:lwjgl-nfd"
    implementation "org.lwjgl:lwjgl-nuklear"
    implementation "org.lwjgl:lwjgl-opengl"
    implementation "org.lwjgl:lwjgl-openal"
    implementation "org.lwjgl:lwjgl-shaderc"
    implementation "org.lwjgl:lwjgl-spvc"
    implementation "org.lwjgl:lwjgl-stb"
    implementation "org.lwjgl:lwjgl-sdl"
    implementation "org.lwjgl:lwjgl-vulkan"
    implementation "org.lwjgl:lwjgl-openxr"
    implementation 'org.reflections:reflections:0.10.2'
    implementation 'io.github.classgraph:classgraph:4.8.180'
    implementation "org.joml:joml:${jomlVersion}"
    implementation 'org.tinylog:tinylog-api:2.7.0'
    implementation 'org.tinylog:tinylog-impl:2.7.0'


    implementation 'net.bytebuddy:byte-buddy:1.18.11-jdk5'
    implementation "net.bytebuddy:byte-buddy-agent:1.18.11"

    implementation "org.json:json:20250107"
    implementation "io.github.spair:imgui-java-app:${imguiVersion}"
    //implementation "com.code-disaster.steamworks4j:steamworks4j:1.9.0"
    //implementation "com.code-disaster.steamworks4j:steamworks4j-server:1.9.0"

    runtimeOnly "org.lwjgl:lwjgl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-assimp::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-glfw::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nanovg::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-par::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nfd::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-nuklear::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openal::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-shaderc::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-opengl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-spvc::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-stb::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-sdl::$lwjglNatives"
    runtimeOnly "org.lwjgl:lwjgl-openxr::$lwjglNatives"

    runtimeOnly "io.github.spair:imgui-java-app:${imguiVersion}"
}

application {
    mainClass = 'net.ice.relic.common.test.VulkanTest'
}

jar {
    from ('./src/main/java') {
        include 'META-INF/services/org.tinylog.writers.Writer'
    }
    manifest {
        attributes(
                'Main-Class': 'net.ice.relic.common.test.VulkanTest'
        )
    }
}

tasks.named('jar') {
    from {
        configurations.runtimeClasspath.collect { it.isDirectory() ? it : zipTree(it) }
    }
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.named('distZip') {
    entryCompression = ZipEntryCompression.STORED
}

tasks.named("distTar") {
    enabled = false
}





